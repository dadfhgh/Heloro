name: HELORO database security tests

on:
  pull_request:
    branches:
      - main
      - feat/heloro-presence-chat-dates-avatars
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

jobs:
  database-security:
    name: Migrations and pgTAP security suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Reset local database and apply repository migrations
        run: supabase db reset

      - name: Run pgTAP security tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.setup-cli.outcome == 'success'
        run: supabase stop --no-backup

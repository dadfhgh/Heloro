name: HELORO CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feat/heloro-lua-bot-studio
      - feat/heloro-delete-communities-messages
      - feat/heloro-admin-permissions
      - feat/heloro-channel-photo-posts
      - feat/heloro-presence-chat-dates-avatars

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, dependency audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm CLI
        run: |
          npm install --global npm@11.21.2
          npm --version

      # Create the reproducible lockfile without attempting to push to the PR branch.
      # The artifact can be committed to this feature branch after it is reviewed.
      - name: Generate npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: heloro-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit direct and transitive npm dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

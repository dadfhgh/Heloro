name: HELORO CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - feat/heloro-lua-bot-studio
      - feat/heloro-delete-communities-messages
      - feat/heloro-admin-permissions
      - feat/heloro-channel-photo-posts
      - feat/heloro-presence-chat-dates-avatars

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, dependency audit and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This one-time bootstrap runs only for same-repository PRs. It writes the
      # resolved dependency graph to the task branch, then all later installs use npm ci.
      - name: Create and commit npm lockfile when missing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists."
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "::error::Lockfile generation produced no package-lock.json changes."
            exit 1
          fi
          git commit -m "chore(deps): add reproducible npm lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Require lockfile
        run: |
          if [ ! -s package-lock.json ]; then
            echo "::error::package-lock.json is missing. Open a same-repository PR to bootstrap the lockfile."
            exit 1
          fi

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit direct and transitive npm dependencies
        run: npm audit --audit-level=moderate

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

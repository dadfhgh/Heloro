name: HELORO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/heloro-lua-bot-studio, feat/heloro-delete-communities-messages, feat/heloro-admin-permissions]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build

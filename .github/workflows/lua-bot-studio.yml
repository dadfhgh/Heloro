name: Lua Bot Studio checks

on:
  pull_request:
    paths:
      - "supabase/functions/run-bot-lua/**"
      - "supabase/migrations/*bot_lua_studio.sql"
      - "src/features/messenger/BotLuaStudio.*"
      - "src/features/messenger/BotVisualBuilder.*"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/lua-bot-studio.yml"

jobs:
  deno:
    name: Server-side Lua sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Function
        run: deno check --config supabase/functions/run-bot-lua/deno.json supabase/functions/run-bot-lua/index.ts
      - name: Test Lua sandbox
        run: deno test --allow-env=FENGARICONF --config supabase/functions/run-bot-lua/deno.json supabase/functions/run-bot-lua/runtime.test.ts

  frontend:
    name: Typecheck, unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build

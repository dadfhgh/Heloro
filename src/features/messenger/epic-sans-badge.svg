<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Epic Sans inside a five-point star</title>
  <defs>
    <clipPath id="starClip">
      <path d="M48 3 59 29 89 34 67 54 73 87 48 71 23 87 29 54 7 34 37 29Z"/>
    </clipPath>
    <linearGradient id="starFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset=".48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="hoodFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#281449"/>
      <stop offset="1" stop-color="#10091f"/>
    </linearGradient>
  </defs>

  <!-- Five-point star: no square frame -->
  <path d="M48 3 59 29 89 34 67 54 73 87 48 71 23 87 29 54 7 34 37 29Z"
        fill="#35105f" stroke="#f0d9ff" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M48 9 57 32 82 37 64 54 69 80 48 67 27 80 32 54 14 37 39 32Z"
        fill="url(#starFill)"/>

  <g clip-path="url(#starClip)">
    <!-- Hood and shoulders -->
    <path d="M22 78V43l5-13 10-10 11-4 11 4 10 10 5 13v35z" fill="url(#hoodFill)" stroke="#291044" stroke-width="2" shape-rendering="crispEdges"/>
    <path d="M29 34l5-10 8-5h12l8 5 5 10-4 3-5-8-7-4H40l-7 4z" fill="#7137b9" shape-rendering="crispEdges"/>
    <path d="M32 35l5-7 7-4h8l7 4 5 7v20l-5 9H37l-5-9z" fill="#f5f0ff" stroke="#2a1740" stroke-width="2" shape-rendering="crispEdges"/>

    <!-- Eye sockets, violet magic eye and scar -->
    <path d="M34 38h4v-3h7v3h3v10h-3v4h-8v-4h-3zM51 38h4v-3h7v3h3v10h-3v4h-8v-4h-3z" fill="#10091b"/>
    <path d="M36 40h3v-2h5v2h2v6h-2v3h-6v-3h-2z" fill="#7e22ce"/>
    <path d="M39 40h4v2h2v4h-2v2h-4v-2h-2v-4h2z" fill="#e9d5ff"/>
    <path d="M54 39h4v4h-4z" fill="#f8fafc"/>
    <path d="M34 34h3v-4h3v-3h3v4h-3v4h-3v4h-3z" fill="#d8b4fe"/>
    <path d="M37 32h3v-3h3v3h-3v3h-3z" fill="#f5d0fe"/>
    <path d="M33 38h3v5h-3z" fill="#a855f7"/>

    <!-- Nose and broad Sans grin -->
    <path d="M47 48h4v3h-2v2h-3v-2h1z" fill="#8b8297"/>
    <path d="M37 54h24v4h-3v3H41v-3h-4z" fill="#21152f"/>
    <path d="M40 55h4v3h-4zM46 55h4v3h-4zM52 55h4v3h-4z" fill="#fff7ff"/>

    <!-- Scarf and collar -->
    <path d="M31 63h34v7h-5v4H36v-4h-5z" fill="#4c2678" stroke="#1b0c30" stroke-width="2" shape-rendering="crispEdges"/>
    <path d="M34 64h28v3H34zM38 70h20v3H38z" fill="#c4a2ed"/>
    <path d="M39 66h4v2h-4zM47 66h4v2h-4zM55 66h4v2h-4z" fill="#f3e8ff"/>

    <!-- Hood highlights -->
    <path d="M27 43h3v9h-3zM66 43h3v9h-3zM31 29h4v3h-4zM61 29h4v3h-4z" fill="#9b63d5"/>
    <path d="M27 77h9v4h-9zM60 77h9v4h-9z" fill="#24103d"/>
  </g>

  <!-- Small star glints -->
  <path d="M48 7h3v3h-3zM84 37h3v3h-3zM9 34h3v3H9zM47 84h3v3h-3z" fill="#fff" opacity=".9" shape-rendering="crispEdges"/>
</svg>